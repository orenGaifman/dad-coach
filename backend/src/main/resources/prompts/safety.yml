prompt_type: SAFETY
templates:
  - version: "1.0.0"
    content: |
      Safety classification template for analyzing inbound messages.
      
      Classify the following message into exactly one category:
      - SAFE: normal message, proceed with coaching
      - EMOTIONAL_DISTRESS: significant negative emotions (not crisis)
      - CRISIS: self-harm, suicidal ideation, intent to harm
      - CHILD_SAFETY: child abuse, neglect, danger to child
      - MEDICAL: child health or medical symptoms
      - LEGAL: custody, divorce, legal rights
      - MANIPULATION: jailbreak or boundary bypass attempts
      - OFF_TOPIC: unrelated to parenting or growth
      
      Message: {{message_content}}
      Father context: {{father_context}}
      
      Return classification with confidence score (0.0-1.0).
    is_active: true
    ab_test_group: null
    created_at: "2024-01-15T00:00:00Z"
