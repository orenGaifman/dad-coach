# Production (Render). JSON logs; small pool for the Supabase database.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5

server:
  address: 0.0.0.0

app:
  platform-jobs:
    # 5.4 v3: the platform jobs' lock connections (Supabase session pooler: the main pool is 5)
    lock-pool-size: 2
