# Dad Coach backend. Every value comes from an environment variable (names in docs/implementation/DEPLOYMENT.md);
# the defaults are for local development only - a deployed instance refuses to start without its secrets
# (ProductionStartupGuard).
spring:
  application:
    name: dad-coach-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dadcoach}
    username: ${DB_USERNAME:dadcoach}
    password: ${DB_PASSWORD:dadcoach}
  autoconfigure:
    # no form login / generated password: every surface authenticates with its own filter chain
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Parallel work streams own separate version ranges (V23-V29, V30-V39, V40-V49) and may land out of order.
    out-of-order: true
    # A fresh, empty database is built from the V23 baseline (FlywayBaselineStrategy, DECISIONS D-011);
    # an existing one (production) migrates normally. V1-V22 are the history production ran.
    baseline-version: 23
    baseline-description: "baseline - production schema after V23"

server:
  # Render injects PORT; fall back to SERVER_PORT, then 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    max-http-form-post-size: 262144

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/calendar/callback}

dad-coach:
  web:
    # The dashboard (D-006): the coach's dashboard_url is <WEB_BASE_URL>/login; belt images live under /belts.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  security:
    # HMAC secret for the Google Calendar connect links and OAuth state (historical env name).
    link-secret: ${JWT_SECRET:local-development-link-secret-not-for-production}
    # The operator API (/api/v1/admin/**) needs this key in X-API-Key; unset = closed to everyone.
    admin-api-key: ${DADCOACH_ADMIN_API_KEY:}
  whatsapp:
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v25.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    waba-id: ${WHATSAPP_WABA_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
    # true = a turn runs on the webhook thread (tests only); production answers Meta first.
    inbound-sync: false

dadcoach:
  scheduler:
    # Weekly goals completed and belts announced: Sunday 06:00 UTC (09:00 Israel).
    weekly-goal-completion-cron: "0 0 6 * * SUN"

# The key the platform sends on /api/tools/** and /api/context/** (the platform's DAD_COACH_API_KEY).
tool-api:
  api-key: ${TOOL_API_KEY:}

workflow:
  platform:
    enabled: ${WORKFLOW_PLATFORM_ENABLED:false}
    base-url: ${WORKFLOW_PLATFORM_BASE_URL:http://localhost:8081}
    api-key: ${WORKFLOW_PLATFORM_API_KEY:}
    worker-key: ${WORKFLOW_PLATFORM_WORKER_KEY:dad_3}
    # The workflow every message runs (the caller selects; the platform never chooses one).
    workflow-key: ${WORKFLOW_PLATFORM_WORKFLOW_KEY:dad-coach-3}
    connect-timeout-ms: 5000
    read-timeout-ms: 90000
    # Receiver for the platform's scheduled-response callback (/api/integration/workflow/scheduled-response).
    scheduled-response:
      enabled: ${WORKFLOW_PLATFORM_CALLBACK_ENABLED:false}
      api-key: ${WORKFLOW_PLATFORM_CALLBACK_API_KEY:}
      # Approved WhatsApp template (body "{{1}}" = the message) used outside the 24h window; blank = not sent.
      template-name: ${WORKFLOW_PLATFORM_CALLBACK_TEMPLATE_NAME:}

belt:
  images:
    base-url: ${BELT_IMAGES_BASE_URL:${dad-coach.web.base-url}/belts}
    white: white-belt.webp
    yellow: yellow-belt.webp
    orange: orange-belt.webp
    green: green-belt.webp
    blue: blue-belt.webp
    brown: brown-belt.webp
    black: black-belt.webp
