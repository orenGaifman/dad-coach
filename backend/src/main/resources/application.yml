spring:
  application:
    name: dad-coach-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dadcoach}
    username: ${DB_USERNAME:dadcoach}
    password: ${DB_PASSWORD:dadcoach}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 262144  # 256 KB

spring.servlet.multipart:
  max-request-size: 256KB
  max-file-size: 256KB

spring.codec:
  max-in-memory-size: 262144  # 256 KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db
          show-details: never
        # Custom workflow health group for detailed monitoring
        workflow:
          include: workflowEngine,googleCalendar,whatsApp,scheduler
          show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/calendar/callback}

dad-coach:
  web:
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long!!}
      issuer: ${JWT_ISSUER:dad-coach}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  whatsapp:
    api-base-url: https://graph.facebook.com
    api-version: ${WHATSAPP_API_VERSION:v25.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    waba-id: ${WHATSAPP_WABA_ID:}
    phone-number: ${WHATSAPP_PHONE_NUMBER:+972501234567}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      timeout-seconds: 10
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      timeout-seconds: 30
      api-version: "2023-06-01"
    cost:
      daily-token-budget: ${AI_DAILY_TOKEN_BUDGET:50000}

dadcoach:
  features:
    ai-message-generation: true          # Toggle AI vs fallback template messages
    morning-reminders: true              # Toggle morning reminder scheduler job for Quality Time
  scheduler:
    # Morning reminder job - runs at 7:50 AM UTC, sends at 8 AM local time
    morning-reminder-cron: "0 50 7 * * *"
    # Follow-up transition job - checks for ended Quality Time events (every 15 minutes)
    follow-up-interval-ms: 900000
    # Stale state detection job - checks for fathers stuck in follow-up state (every 1 hour)
    stale-detection-interval-ms: 3600000
    # Batch size for processing fathers to avoid overwhelming WhatsApp rate limits
    batch-size: 100
  workflow:
    # Maximum message exchanges before forcing summary/exit (Requirement 5.6)
    max-exchanges-per-state: 5
    # Days ahead to look in Google Calendar for slots (Requirement 2.3)
    calendar-lookahead-days: 7
    # Minimum Quality Time slot duration in minutes (Requirement 2.3)
    min-slot-duration-minutes: 30
    # AI message generation timeout in milliseconds (Requirement 10.6)
    message-generator-timeout-ms: 5000
    # Maximum exchanges for follow-up conversations (Requirement 7.5)
    max-follow-up-exchanges: 3
  onboarding:
    security:
      wizard-data-encryption-key: ${WIZARD_DATA_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

api:
  rate-limit:
    enabled: true
    window-seconds: 60
    limits:
      FATHER: 60
      ADMIN: 300
      SERVICE: 1000

# Belt images for promotion notifications
# URLs can be full URLs or relative paths from base-url
belt:
  images:
    # Base URL for belt images (e.g., CDN or S3 bucket)
    base-url: ${BELT_IMAGES_BASE_URL:}
    # Individual belt image paths (can be full URLs or relative to base-url)
    white: ${BELT_IMAGE_WHITE:}
    yellow: ${BELT_IMAGE_YELLOW:}
    orange: ${BELT_IMAGE_ORANGE:}
    green: ${BELT_IMAGE_GREEN:}
    blue: ${BELT_IMAGE_BLUE:}
    brown: ${BELT_IMAGE_BROWN:}
    black: ${BELT_IMAGE_BLACK:}
