spring:
  application:
    name: dad-coach-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dadcoach}
    username: ${DB_USERNAME:dadcoach}
    password: ${DB_PASSWORD:dadcoach}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 262144  # 256 KB

spring.servlet.multipart:
  max-request-size: 256KB
  max-file-size: 256KB

spring.codec:
  max-in-memory-size: 262144  # 256 KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db
          show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

conversation:
  session-lock:
    timeout-seconds: 45
  expiration-windows:
    ONBOARDING: PT48H
    DAILY_COACHING: PT24H
    FOLLOW_UP: PT24H
    REFLECTION: PT24H
    INACTIVITY_CHECK: PT48H
    CELEBRATION: PT24H

dad-coach:
  security:
    jwt:
      secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long!!}
      issuer: ${JWT_ISSUER:dad-coach}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  whatsapp:
    api-base-url: https://graph.facebook.com
    api-version: ${WHATSAPP_API_VERSION:v25.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    phone-number: ${WHATSAPP_PHONE_NUMBER:+972501234567}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      timeout-seconds: 10
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      timeout-seconds: 10
      api-version: "2023-06-01"
    cost:
      daily-token-budget: ${AI_DAILY_TOKEN_BUDGET:50000}

dadcoach:
  onboarding:
    security:
      wizard-data-encryption-key: ${WIZARD_DATA_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

api:
  rate-limit:
    enabled: true
    window-seconds: 60
    limits:
      FATHER: 60
      ADMIN: 300
      SERVICE: 1000
