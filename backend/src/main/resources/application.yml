# Dad Coach backend. Every value comes from an environment variable (names in docs/implementation/DEPLOYMENT.md);
# the defaults are for local development only - a deployed instance refuses to start without its secrets
# (ProductionStartupGuard).
spring:
  application:
    name: dad-coach-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dadcoach}
    username: ${DB_USERNAME:dadcoach}
    password: ${DB_PASSWORD:dadcoach}
  autoconfigure:
    # no form login / generated password: every surface authenticates with its own filter chain
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Parallel work streams own separate version ranges (V23-V29, V30-V39, V40-V49) and may land out of order.
    out-of-order: true
    # A fresh, empty database is built from the V23 baseline (FlywayBaselineStrategy, DECISIONS D-011);
    # an existing one (production) migrates normally. V1-V22 are the history production ran.
    baseline-version: 23
    baseline-description: "baseline - production schema after V23"

server:
  # Render injects PORT; fall back to SERVER_PORT, then 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    max-http-form-post-size: 262144

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/calendar/callback}

dad-coach:
  web:
    # The dashboard (D-006): the coach's dashboard_url is <WEB_BASE_URL>/login; belt images live under /belts.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  security:
    # HMAC secret for the Google Calendar connect links and OAuth state (historical env name).
    link-secret: ${JWT_SECRET:local-development-link-secret-not-for-production}
    # The operator API (/api/v1/admin/**) needs this key in X-API-Key; unset = closed to everyone.
    admin-api-key: ${DADCOACH_ADMIN_API_KEY:}
  whatsapp:
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v25.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    waba-id: ${WHATSAPP_WABA_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
    # true = a turn runs on the webhook thread (tests only); production answers Meta first.
    inbound-sync: false
    # D-038 (DC-B3): an inbound message is marked handled only once it was answered, so Meta's redelivery of one the
    # platform or Meta failed is processed again; false = marked on arrival (before D-038). A claim older than the
    # lease belongs to a worker that died and is taken over.
    inbound:
      retry-unanswered: ${DAD_COACH_WHATSAPP_INBOUND_RETRY_UNANSWERED:true}
      claim-lease: ${DAD_COACH_WHATSAPP_INBOUND_CLAIM_LEASE:PT10M}
    # D-038 (DC-B2): Meta's status receipts update the scheduled message / dashboard link they belong to; false = ignored.
    receipts:
      enabled: ${DAD_COACH_WHATSAPP_RECEIPTS_ENABLED:true}
    # D-042 (Phase 6.1): the platform's shared-number gateway reports what became of a message it held
    # (POST /api/integration/channel/held-outcome). Off = the endpoint answers 404 and changes nothing.
    gateway-held-reports: ${GATEWAY_HELD_REPORTS:false}
  # D-029 (Big Boss D-176): a WhatsApp voice note is transcribed by ElevenLabs and read like a typed message. Turned
  # on and off in the admin's integrations screen (on unless the admin turned it off); without a key it stays off.
  voice-notes:
    elevenlabs-api-key: ${ELEVENLABS_API_KEY:}
    elevenlabs-base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    model: ${VOICE_NOTES_MODEL:scribe_v2}
    # Hebrew; blank lets ElevenLabs detect the language.
    language-code: ${VOICE_NOTES_LANGUAGE:heb}
    # About 25 minutes of a WhatsApp voice note; a longer one is answered "too long" without being downloaded.
    max-bytes: ${VOICE_NOTES_MAX_BYTES:3145728}
    timeout-ms: ${VOICE_NOTES_TIMEOUT_MS:60000}
  # D-045 (Unified Workflow 6.3-DC): who sends each kind - Dad Coach itself (DIRECT, default: today's path), SHADOW
  # (today's path + the platform's dry run, differences logged, never a second message) or PLATFORM (the platform's
  # POST /api/v1/worker/messages/send). Anything else = DIRECT.
  messaging:
    modes:
      login-link: ${MESSAGING_MODE_LOGIN_LINK:DIRECT}
      # D-046: the platform's scheduled-response callbacks (timers, daily check, weekly plan). (D-051: the belt
      # promotion's switch is gone with its notifier - the weekly job promotes no one since D-030.)
      scheduled: ${MESSAGING_MODE_SCHEDULED:DIRECT}
      # D-048: the lines answering a father's message - the coach's reply, Dad Coach's fixed lines, a session button's
      # answer, an answer from data. The "something went wrong" line and the deletion answer always go directly.
      reply: ${MESSAGING_MODE_REPLY:DIRECT}
      fixed-line: ${MESSAGING_MODE_FIXED_LINE:DIRECT}
      button-reply: ${MESSAGING_MODE_BUTTON_REPLY:DIRECT}
      ready-answer: ${MESSAGING_MODE_READY_ANSWER:DIRECT}
    # The platform's delivery reports (POST /api/integration/channel/delivery-status, callback key); off = 404.
    delivery-status-enabled: ${MESSAGING_DELIVERY_STATUS_ENABLED:false}
    # After an ambiguous answer: ask the platform by key this long after the first POST (then every as long, for 1 h).
    reconcile-after: ${MESSAGING_RECONCILE_AFTER:PT5M}
    send-read-timeout-ms: ${MESSAGING_SEND_READ_TIMEOUT_MS:12000}
    # D-048: a conversational line's POST /send (the father is waiting): unanswered by then = on its way, never re-sent
    reply-read-timeout-ms: ${MESSAGING_REPLY_READ_TIMEOUT_MS:5000}
    # D-047: the reconcile job's lookup by key, and how long one reconcile pass may take rows (the rest: next minute)
    lookup-read-timeout-ms: ${MESSAGING_LOOKUP_READ_TIMEOUT_MS:5000}
    reconcile-pass-budget: ${MESSAGING_RECONCILE_PASS_BUDGET:PT15S}

app:
  scheduling:
    # D-043 (Unified Workflow 6.0b): true = the jobs that send WhatsApp keep the single scheduler thread and the
    # housekeeping jobs (receipt retry, template refresh, purges, deletions, keep-warm) get their own small pool;
    # anything else (false, unset, a typo) = one thread runs every job, exactly as before.
    lanes: ${APP_SCHEDULING_LANES:false}

dadcoach:
  scheduler:
    # Weekly goals completed (status, streaks; belts come from sessions since D-030): Sunday 06:00 UTC (09:00 Israel).
    weekly-goal-completion-cron: "0 0 6 * * SUN"

# The key the platform sends on /api/tools/** and /api/context/** (the platform's DAD_COACH_API_KEY).
tool-api:
  api-key: ${TOOL_API_KEY:}

workflow:
  platform:
    enabled: ${WORKFLOW_PLATFORM_ENABLED:false}
    base-url: ${WORKFLOW_PLATFORM_BASE_URL:http://localhost:8081}
    api-key: ${WORKFLOW_PLATFORM_API_KEY:}
    worker-key: ${WORKFLOW_PLATFORM_WORKER_KEY:dad_3}
    # The workflow every message runs (the caller selects; the platform never chooses one).
    workflow-key: ${WORKFLOW_PLATFORM_WORKFLOW_KEY:dad-coach-3}
    connect-timeout-ms: 5000
    read-timeout-ms: 90000
    # D-039 (Phase 3.4): report what was actually delivered to the platform's conversation timeline. Off = as before.
    delivery-reports: ${PLATFORM_DELIVERY_REPORTS:false}
    # D-049 (Phase 5.3 slice D): the hour-before reminder's guard may skip its AI turn when no session is there. Off = it
    # always proceeds (the turn as before). The morning / follow-up tool-only turns are switched by the workflow YAML.
    session-timers-guard: ${DC_SESSION_TIMERS_GUARD:false}
    # D-050 (Unified Workflow 5.4): Dad Coach owns its session timers - a session closed from the dashboard or the "done"
    # button cancels its timers too (not only a WhatsApp turn), and every 10 minutes the timers of upcoming sessions are
    # read back and the missing ones armed. Off = only the WhatsApp turn arms and cancels, as before.
    session-timers-product-owned: ${DC_SESSION_TIMERS_PRODUCT_OWNED:false}
    # Receiver for the platform's scheduled-response callback (/api/integration/workflow/scheduled-response).
    scheduled-response:
      enabled: ${WORKFLOW_PLATFORM_CALLBACK_ENABLED:false}
      api-key: ${WORKFLOW_PLATFORM_CALLBACK_API_KEY:}
      # Approved WhatsApp template (body "{{1}}" = the message) used outside the 24h window; blank = not sent.
      template-name: ${WORKFLOW_PLATFORM_CALLBACK_TEMPLATE_NAME:}

