# DC-B: the dashboard SPA's backend (sign-in, father + admin JSON APIs, ops API, training).
# Loaded by com.dadcoach.auth.DashboardProperties (@PropertySource) - every value comes from the environment.

# Operator API (POST /api/ops/**, X-API-Key). Unset = the ops surface is closed to everyone (fail closed).
dadcoach.dashboard.ops-api-key=${DADCOACH_OPS_API_KEY:}
# The session cookie is Secure everywhere except plain-http local development.
dadcoach.dashboard.cookie-secure=${DADCOACH_COOKIE_SECURE:true}
# Dad Coach's public WhatsApp number (E.164) for the "talk to the coach" wa.me links. Unset = no button.
dadcoach.dashboard.whatsapp-public-number=${DADCOACH_WHATSAPP_PUBLIC_NUMBER:}
# The AI Workflow Platform admin API key, for the admin's read-only "platform" panel. Unset = "not configured".
dadcoach.dashboard.platform-admin-api-key=${WORKFLOW_PLATFORM_ADMIN_API_KEY:}

# Training videos (Big Boss D-171). Unset base URL = no videos anywhere (the pages say "soon").
dadcoach.dashboard.training.media-base-url=${TRAINING_MEDIA_BASE_URL:}
# Bunny "URL Token Authentication Key"; required unless media-unsigned (local lab only).
dadcoach.dashboard.training.media-token-key=${TRAINING_MEDIA_TOKEN_KEY:}
dadcoach.dashboard.training.media-unsigned=${TRAINING_MEDIA_UNSIGNED:false}
