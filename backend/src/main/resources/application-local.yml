# Local development profile
# Plain-text logging, Swagger enabled, default database values

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dadcoach
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

dad-coach:
  whatsapp:
    verify-token: dad-coach-local-dev

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Use port 8081 to avoid conflict with ai-workflow-platform on 8080
server:
  port: 8081
