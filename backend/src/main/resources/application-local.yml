# Local development (docker-compose postgres on 5432). Flyway builds the schema from the baseline.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dadcoach}
    username: ${DB_USERNAME:dadcoach}
    password: ${DB_PASSWORD:dadcoach}

management:
  endpoint:
    health:
      show-details: always

dad-coach:
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:dad-coach-local-dev}

# 8080 is the platform's default port locally
server:
  port: ${PORT:8081}
