# Local development: Postgres + the backend image (the dashboard is added by the frontend work).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dadcoach
      POSTGRES_USER: dadcoach
      POSTGRES_PASSWORD: dadcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dadcoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/dadcoach
      DB_USERNAME: dadcoach
      DB_PASSWORD: dadcoach
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
